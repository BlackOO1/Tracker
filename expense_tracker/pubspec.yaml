name: expense_tracker
description: A personal budget planner & expense tracker app built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  provider: ^6.1.2
  # Local database (fast, offline, no server needed)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Charts
  fl_chart: ^0.68.0
  # Date formatting
  intl: ^0.19.0
  # CSV export/import
  csv: ^6.0.0
  # File picking (for CSV import)
  file_picker: ^8.1.2
  # Sharing/saving files
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  # Icons
  cupertino_icons: ^1.0.8
  # Uuid for unique IDs
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/
